services:
  qdrant:
    image: qdrant/qdrant:v1.13.4
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  embed:
    build: .
    command: brain-embed
    environment:
      BRAIN_EMBED_PORT: "8091"
    ports:
      - "8091:8091"
    restart: unless-stopped
    mem_limit: 1200m

volumes:
  qdrant_data:
