[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brain-mcp"
version = "0.1.0"
description = "MCP server: hybrid dense+BM25 retrieval over a markdown vault"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Artur0927" }]
keywords = ["mcp", "rag", "qdrant", "fastembed"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "mcp>=1.28.0,<2",
  "qdrant-client>=1.18.0",
  "fastembed>=0.8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
brain-mcp = "brain_mcp.server:main"
brain-embed = "brain_mcp.embed_service:main"
brain-index = "brain_mcp.full_index:main"
brain-reindex = "brain_mcp.reindex_changed:main"
brain-lessons-index = "brain_mcp.build_lessons_index:main"
brain-dashboard = "brain_mcp.dashboard:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
brain_mcp = ["py.typed"]
